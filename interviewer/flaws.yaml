- id: CL-07
  domain: CL
  tier: 2
  lens: security
  file: infrastructure/rds.tf
  anchor: storage_encrypted       = false
  flaw: No encryption at rest, deletion protection or final snapshot; the instance is publicly accessible.
  probe: What do compliance reviews say about this?
  strong: KMS, private, deletion protection.
  grow: Explain encryption at rest and what it does not cover.
- id: CL-08
  domain: CL
  tier: 2
  lens: reliability
  file: infrastructure/rds.tf
  anchor: backup_retention_period = 0
  flaw: Automated backups are disabled.
  probe: A table is dropped by mistake. What can we recover?
  strong: Backups, PITR, tested restore.
  grow: Explain RPO and RTO.
- id: CL-09
  domain: CL
  tier: 3
  lens: reliability
  file: infrastructure/rds.tf
  anchor: instance_class    = "db.t3.medium"
  flaw: 'One instance, no read replica or Multi-AZ: heavy dashboards contend with writes and failure means downtime.'
  probe: Dashboard queries slow down writes. What do you do?
  strong: Replica for reads, Multi-AZ, caching.
  grow: Compare scaling reads and availability.
- id: CL-10
  domain: CL
  tier: 1
  lens: security
  file: infrastructure/ecs.tf
  anchor: '{ name = "DB_PASSWORD"'
  flaw: Secrets are plain environment variables in the task definition.
  probe: Where should these come from?
  strong: Secrets Manager or SSM; task role.
  grow: Explain how secrets reach a container.
- id: CL-11
  domain: CL
  tier: 1
  lens: security
  file: docker-compose.yml
  anchor: 'build: .'
  flaw: Containers run as root with no memory or CPU limits, and secrets are in the compose file.
  probe: What would an attacker with code execution in the container own?
  strong: Non-root user, limits, secrets handling.
  grow: Harden a compose service.
- id: CL-12
  domain: CL
  tier: 2
  lens: reliability
  file: docker-compose.yml
  anchor: 'depends_on:'
  flaw: 'depends_on only waits for start, not health: no healthchecks defined, so the app may start before the database is ready.'
  probe: Start everything at once. What fails?
  strong: Healthchecks, condition service_healthy, retry on connect.
  grow: Explain startup ordering problems.
- id: CL-13
  domain: CL
  tier: 1
  lens: security
  file: Dockerfile
  anchor: FROM node:latest
  flaw: Unpinned latest image, runs as root, installs everything, no multi-stage build or .dockerignore.
  probe: What would you change in this Dockerfile?
  strong: Pin, non-root, multi-stage, production deps.
  grow: Explain reproducible image builds.
- id: DSO-01
  domain: DSO
  tier: 1
  lens: security
  file: src/server/config.ts
  anchor: 'password: ''Pr0d$ecret!2024'''
  flaw: Production credentials are hard-coded in source.
  probe: Who has the database password?
  strong: Environment or secret manager; rotate; scan history.
  grow: Explain how to remove a committed secret safely.
- id: DSO-02
  domain: DSO
  tier: 1
  lens: security
  file: src/client/store/authStore.ts
  anchor: localStorage.setItem(AUTH_KEY, token)
  flaw: The JWT is stored in localStorage, readable by any script on the page.
  probe: What can an XSS bug do to this app?
  strong: HttpOnly cookies; XSS exposure; trade-offs.
  grow: Compare token storage options.
  chain: authz
- id: DSO-03
  domain: DSO
  tier: 1
  lens: delivery
  file: package.json
  anchor: '"express": "^4.18.0"'
  flaw: All dependencies use caret ranges, so installs can drift between machines.
  probe: Two developers install a week apart. What differs?
  strong: Lockfile, npm ci, pinning policy, Renovate.
  grow: Explain semver ranges and lockfiles.
- id: DSO-04
  domain: DSO
  tier: 2
  lens: security
  file: package.json
  anchor: '"jsonwebtoken": "^8.5.1"'
  flaw: jsonwebtoken 8.x has known CVEs and express 4 has known issues; nothing runs npm audit.
  probe: How do you find vulnerable dependencies?
  strong: npm audit in CI, upgrade policy, SCA.
  grow: Describe a dependency-risk routine.
- id: DSO-05
  domain: DSO
  tier: 1
  lens: security
  file: src/client/api/client.ts
  anchor: 'baseURL: ''http://api.teammetrics.internal:3000'''
  flaw: The API base URL is hard-coded in the client and not HTTPS.
  probe: How does this behave in staging?
  strong: Environment config, HTTPS, build-time vars.
  grow: Explain configuration in a built SPA.
- id: DSO-06
  domain: DSO
  tier: 3
  lens: security
  file: src/client/components/ExportButton.tsx
  anchor: await apiClient.post('/api/export'
  flaw: State-changing POSTs carry no CSRF protection; fine with bearer tokens today, but vulnerable if auth moves to cookies.
  probe: If we move to cookies, what else changes?
  strong: SameSite, CSRF tokens, origin checks.
  grow: Explain CSRF.
- id: DSO-07
  domain: DSO
  tier: 2
  lens: security
  file: tests/server/auth.api.test.ts
  anchor: import config from '../../src/server/config'
  flaw: Tests import the production config module directly; there is no separate test configuration, so a test run could touch production resources if wired to them.
  probe: What stops a test from hitting production?
  strong: Separate config by environment, no prod credentials in tests.
  grow: Describe how you isolate test environments.
- id: DSO-08
  domain: DSO
  tier: 1
  lens: security
  file: .github/workflows/ci.yml
  anchor: 'AWS_ACCESS_KEY_ID:'
  flaw: Cloud credentials are plain text in the workflow.
  probe: What do you do if these were real?
  strong: Rotate, OIDC, secrets.
  grow: Explain OIDC for CI.
- id: DSO-09
  domain: DSO
  tier: 2
  lens: delivery
  file: .github/workflows/ci.yml
  anchor: 'run: npm test'
  flaw: No audit, SAST, secret scanning or image scanning; no typecheck or lint.
  probe: What does the pipeline not catch?
  strong: Add scanners and gates.
  grow: Pick the checks with the best value.
- id: DSO-10
  domain: DSO
  tier: 3
  lens: delivery
  file: .github/workflows/ci.yml
  anchor: 'branches: ''*'''
  flaw: Every branch push can deploy to production.
  probe: Push a feature branch. What happens?
  strong: main only, environments, approvals.
  grow: Design branch and environment rules.
- id: DSO-11
  domain: DSO
  tier: 3
  lens: delivery
  file: .github/workflows/ci.yml
  anchor: --force-new-deployment
  flaw: No approval gate, no staging, no health verification or rollback.
  probe: The new version is broken. What happens next?
  strong: Staged rollout, health gates, rollback.
  grow: Describe progressive delivery.
- id: DSO-12
  domain: DSO
  tier: 2
  lens: security
  file: src/server/services/notificationService.ts
  anchor: const SENDGRID_KEY = 'SG.hardcoded-key-here'
  flaw: Third-party API keys are hard-coded.
  probe: Where do provider keys live?
  strong: Secret manager; rotation.
  grow: Same as DSO-01, applied to vendors.
- id: DSO-13
  domain: DSO
  tier: 2
  lens: security
  file: src/server/middleware/rateLimit.ts
  anchor: const limiter = rateLimit({
  flaw: The limiter is keyed by IP, so one noisy user behind a shared NAT throttles everyone.
  probe: 50 people share an office IP. What happens?
  strong: Key by user or token; per-route limits.
  grow: Choose rate-limit keys.
- id: DSO-14
  domain: DSO
  tier: 3
  lens: reliability
  file: src/server/middleware/rateLimit.ts
  anchor: 'max: 100,'
  flaw: 'The default in-memory store is per process: three instances give three times the limit and reset on deploy.'
  probe: We run three instances. What is the real limit?
  strong: Shared store (Redis) or edge limiting.
  grow: Design distributed rate limiting.
- id: DSO-15
  domain: DSO
  tier: 3
  lens: security
  file: src/server/middleware/auth.ts
  anchor: req.user = payload
  flaw: 'There is no token revocation: a stolen or suspended user''s token works for 24 hours.'
  probe: An employee leaves. When does access end?
  strong: Short tokens, refresh, denylist, session store.
  grow: Compare stateless and stateful sessions.
- id: DSO-16
  domain: DSO
  tier: 1
  lens: security
  file: infrastructure/rds.tf
  anchor: password = "Pr0d$ecret!2024"
  flaw: The database password is committed in Terraform (and ends up in state).
  probe: Where does the password live after apply?
  strong: Secrets Manager, no secrets in state.
  grow: Explain Terraform state sensitivity.
