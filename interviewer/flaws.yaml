  anchor: useState<Filters>
  flaw: Filter state lives in Dashboard, so every keystroke re-renders the whole dashboard including the table.
  probe: Type quickly in the search box. What re-renders?
  strong: Explains lifting state down; colocation; memoising the table or debouncing.
  grow: Explain where state should live and why.
