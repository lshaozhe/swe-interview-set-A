# TeamMetrics (Set A, TypeScript edition): flaw manifest. Interviewer only. Never share with the engineer.
#
# tier 1 = spots it and explains the impact          -> evidence for S1
# tier 2 = fixes it and explains why/what breaks      -> evidence for S2
# tier 3 = reasons about failure modes and trade-offs -> evidence for S3
#
# lens = the aspect of web-app engineering the flaw exercises, so coverage can be checked:
#   security | correctness | performance | a11y | data-integrity | reliability | observability | quality | delivery | maintainability
#
# proof: true means interviewer/proofs/ has a test that passes while the flaw exists.
# anchor is text that must still appear in the file (npm run check verifies it).

domains:
  FE: Frontend Engineering
  BE: Backend Engineering
  CL: Cloud Application Engineering
  SA: Software Architecture
  DA: Data Architecture
  DSO: DevSecOps
flaws:
- id: FE-01
  domain: FE
  tier: 1
  lens: performance
  file: src/client/components/Dashboard.tsx
  anchor: const totals = data.reduce(
  flaw: Totals are recomputed on every render and the component is not memoised, so any parent re-render repeats the work.
  probe: The page feels slow with a few thousand reports. Where do you start?
  strong: Profiles first; names useMemo and React.memo and when they help; avoids premature optimisation.
  grow: Describe a time you used the React profiler to find the real cause.
- id: FE-02
  domain: FE
  tier: 2
  lens: performance
