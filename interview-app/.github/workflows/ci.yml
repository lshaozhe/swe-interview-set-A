name: CI/CD Pipeline

on:
  push:
    branches: '*'   # [DSO-T3] Triggers on any branch — not just main/release
                    # A feature branch push can deploy to production

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      # [DSO-T1] AWS credentials hardcoded as plaintext in the YAML file.
      #          Anyone with repo read access has production AWS credentials.
      #          Should use: ${{ secrets.AWS_ACCESS_KEY_ID }} from GitHub Secrets.
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPL3
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: ap-southeast-1

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # [DSO-T2] No security scanning steps:
      #   - No: npm audit (known CVE detection)
      #   - No: Snyk or similar dependency vulnerability scan
      #   - No: SAST (e.g. Semgrep, CodeQL) for code-level security issues
      #   - No: Secret scanning (e.g. trufflehog, gitleaks)
      #   - No: Container image scanning (e.g. Trivy) before push

      - name: Build Docker image
        run: docker build -t teammetrics:${{ github.sha }} .

      - name: Push to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker push $ECR_REGISTRY/teammetrics:${{ github.sha }}

      # [DSO-T3] Deploy runs immediately after tests pass — no approval gate.
      #          No distinction between staging and production environments.
      #          No rollback strategy if deployment fails.
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster teammetrics-prod \
            --service teammetrics-app \
            --force-new-deployment
